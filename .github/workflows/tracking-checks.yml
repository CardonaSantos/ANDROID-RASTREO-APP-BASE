name: MARCAS Rastreo checks
on:
  push:
    branches: ["refactor/marcas-tracking-only"]
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package*.json"
      - "app.json"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test -- --runInBand
